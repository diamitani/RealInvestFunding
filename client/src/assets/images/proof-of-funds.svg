<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <defs>
    <linearGradient id="fundsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0047AB" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0047AB" stop-opacity="0.7"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="200" rx="10" fill="url(#fundsGradient)"/>
  
  <!-- Certificate/Document -->
  <g transform="translate(150, 100)">
    <!-- Certificate Background -->
    <rect x="-65" y="-45" width="130" height="90" rx="3" fill="white"/>
    
    <!-- Certificate Border -->
    <rect x="-60" y="-40" width="120" height="80" rx="2" stroke="#0047AB" stroke-width="2" fill="none"/>
    
    <!-- Certificate Content -->
    <rect x="-50" y="-30" width="100" height="5" rx="1" fill="#0047AB" opacity="0.7"/>
    <rect x="-50" y="-20" width="75" height="5" rx="1" fill="#0047AB" opacity="0.7"/>
    
    <!-- Seal/Verification -->
    <circle cx="40" cy="15" r="15" fill="#0047AB" opacity="0.8"/>
    <circle cx="40" cy="15" r="12" stroke="white" stroke-width="1" fill="none"/>
    <path d="M32,15 L38,21 L48,11" stroke="white" stroke-width="2" fill="none"/>
    
    <!-- $ Symbol and Text Lines -->
    <text x="-40" y="5" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0047AB">$</text>
    <rect x="-25" y="0" width="50" height="5" rx="1" fill="#0047AB" opacity="0.7"/>
    <rect x="-25" y="10" width="35" height="5" rx="1" fill="#0047AB" opacity="0.7"/>
    <rect x="-50" y="25" width="90" height="5" rx="1" fill="#0047AB" opacity="0.7"/>
  </g>
  
  <!-- Text Overlay -->
  <text x="150" y="180" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">PROOF OF FUNDS</text>
</svg>